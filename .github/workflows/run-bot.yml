name: Daily Puppeteer Automation Bot

on:
  schedule:
    # ตั้งเวลาล่วงหน้าเผื่อคิวหน่วงของ GitHub + มีระบบสั่งรันตรงเวลา 06:43 น. ควบคู่กัน
    # (ใน bot.js มีระบบป้องกันข้อมูลซ้ำ 100% จึงไม่เกิดการวางข้อมูลซ้ำแม้รันหลายรอบ)
    - cron: '15 22 * * *'
    - cron: '43 23 * * *'
  # อนุญาตให้กด Run workflow ด้วยตนเอง หรือสั่งผ่าน API (workflow_dispatch) เพื่อให้ทำงานทันทีโดยไม่ติดคิวหน่วง
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install Chrome for Puppeteer
        run: |
          npx puppeteer browsers install chrome

      - name: Run Automation Bot
        env:
          TZ: 'Asia/Bangkok'
          WEB_EMAIL: ${{ secrets.WEB_EMAIL }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          node bot.js

