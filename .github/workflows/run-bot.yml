name: Daily Puppeteer Automation Bot

on:
  schedule:
    # 00:00 UTC = 07:00 น. ตามเวลาไทย (Asia/Bangkok / UTC+7) ทุกวัน
    - cron: '0 0 * * *'
  # อนุญาตให้กด Run workflow ด้วยตนเองผ่านหน้าเว็บ GitHub Actions
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install Chrome for Puppeteer
        run: |
          npx puppeteer browsers install chrome

      - name: Run Automation Bot
        env:
          TZ: 'Asia/Bangkok'
          WEB_EMAIL: ${{ secrets.WEB_EMAIL }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          node bot.js

